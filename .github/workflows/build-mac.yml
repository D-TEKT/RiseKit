name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign (ad-hoc) and zip
        run: |
          VST="build/RiseKit_artefacts/Release/VST3/RiseKit.vst3"
          codesign --force --deep --sign - "$VST"
          mkdir -p dist
          ditto -c -k --keepParent "$VST" dist/RiseKit-mac-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RiseKit-mac-VST3
          path: dist/RiseKit-mac-VST3.zip
